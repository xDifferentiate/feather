name: Build

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # 26.0/26.1 are installed on macos-latest without their iOS platforms.
        xcode: ['26.3', '26.2']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'

      - name: Select Xcode ${{ matrix.xcode }}
        run: |
          ls -d /Applications/Xcode*.app || true
          XCODE=$(ls -d /Applications/Xcode_${{ matrix.xcode }}*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::Xcode ${{ matrix.xcode }} is not installed on this runner"
            exit 1
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Build
        run: |
          agvtool new-version -all $(git rev-parse HEAD)
          make

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Feather-xcode${{ matrix.xcode }}-${{ github.sha }}
          path: packages/*
          if-no-files-found: error
